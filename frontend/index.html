<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/webp" href="/cat-ficon.webp" />
    <link rel="apple-touch-icon" href="/cat-ficon.webp" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clever Cat — Children's Books & Learning Products</title>
    <meta name="description" content="Beautifully designed children's books, activity books, puzzles and learning products that spark creativity and learning." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Loaded as non-blocking: media="print" makes the browser fetch it without
         waiting to render, then it switches to "all" once loaded. -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
    <noscript><link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet" /></noscript>
    <link rel="preconnect" href="https://res.cloudinary.com" />
    <!-- Hero banner data is fetched from JS after the bundle loads, which
         delays the LCP image start on slow connections. Kick the request off
         during HTML parsing instead, so it's already in flight (or done) by
         the time React mounts and asks for it. -->
    <link rel="preload" as="fetch" crossorigin="anonymous" href="https://theclevercat.in/api/banners/active" />
    <!-- TODO: add Clever Cat's own Google Search Console verification tag(s) here -->
    <!-- TODO: add Clever Cat's own Google Analytics (gtag.js) snippet here -->
    <script src="https://checkout.razorpay.com/v1/checkout.js" defer></script>
    <!-- TODO: add Clever Cat's own Meta Pixel snippet here -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
